name: Debug push (sementara)

# SEMENTARA: mencari modul mana yang dikembalikan server sebagai false.
# Tanpa BOSS_IDS asli (boss-ids.js tetap placeholder). Hapus setelah selesai.
on:
  push:
    branches: [claude/new-session-316ei8]
    paths: [".github/workflows/debug-push.yml"]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: production
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push dengan --debug, ringkas hasil
        run: |
          npx tgcloud push --force --debug > out.txt 2>&1 || true
          echo "== ukuran log: $(wc -c < out.txt) byte"
          node -e '
            const L = require("fs").readFileSync("out.txt","utf8").split("\n");
            const line = L.find(l => l.includes("canonical_modules"));
            if (!line) { console.log("tidak ada baris canonical_modules"); process.exit(0); }
            const j = JSON.parse(line.slice(line.indexOf("body: ") + 6));
            const cm = j.result.canonical_modules;
            console.log("revision:", j.result.revision, "| kunci result:", Object.keys(j.result).join(","));
            for (const [k, v] of Object.entries(cm)) if (typeof v !== "string") console.log("BUKAN STRING:", k, "=>", JSON.stringify(v));
            console.log("jumlah modul:", Object.keys(cm).length, "| non-string:", Object.values(cm).filter(v => typeof v !== "string").length);
          '
