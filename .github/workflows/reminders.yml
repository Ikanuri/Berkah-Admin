name: Pengingat

# tgcloud tidak punya cron, jadi GitHub Actions memicu pengecekan pengingat
# supplier tiap ~10 menit. Jadwal GitHub bersifat best-effort (bisa telat
# beberapa menit saat padat). Server juga mengecek tiap ada yang membuka app.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      BOSS_IDS: ${{ secrets.BOSS_IDS }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tick pengingat
        run: |
          first=$(printf '%s' "$BOSS_IDS" | tr -s ', ' '\n\n' | grep -E '^[0-9]+$' | head -n1)
          [ -n "$first" ] || { echo "::error::BOSS_IDS kosong"; exit 1; }
          node scripts/ci/gen-boss-ids.mjs
          npx tgcloud run endpoints/tickReminders '{}' --ctx "{ initData: { user: { id: $first, first_name: \"CI\", is_ci: true } } }"
