name: Deploy

# Satu-satunya jalur deploy. CI tidak punya snapshot lokal, jadi `push --force`
# dipakai dan `concurrency` menjaga agar tidak ada dua deploy bersamaan.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      BOSS_IDS: ${{ secrets.BOSS_IDS }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cek secret
        run: |
          [ -n "$TGCLOUD_TOKEN" ] || { echo "::error::Secret TGCLOUD_TOKEN belum diisi"; exit 1; }
          [ -n "$BOSS_IDS" ] || { echo "::error::Secret BOSS_IDS belum diisi"; exit 1; }

      # Frontend dibangun SEBELUM boss-ids.js ditulis, supaya ID asli tidak pernah
      # bisa ikut masuk bundel publik.
      - name: Build frontend
        run: npm run build

      - name: Tulis boss-ids.js dari secret
        run: node scripts/ci/gen-boss-ids.mjs

      - name: Pastikan BOSS_IDS tidak bocor ke frontend
        run: |
          for id in $(echo "$BOSS_IDS" | tr -s ', ' '\n\n'); do
            if [ ${#id} -ge 6 ] && grep -rqF "$id" dist; then
              echo "::error::ID Bos ditemukan di dist/ (bocor ke frontend)"; exit 1
            fi
          done

      - name: Skema DB, tampilkan perubahan
        run: npx tgcloud migrate --local --dry-run

      - name: Skema DB, terapkan perubahan aman
        run: npx tgcloud migrate --local --safe

      - name: Skema DB, pastikan tidak ada yang tertinggal
        run: |
          out=$(npx tgcloud migrate --local --dry-run)
          echo "$out"
          if ! grep -q "No schema changes" <<<"$out"; then
            echo "::error::Ada perubahan skema yang butuh persetujuan manual (hapus/ubah tipe). Jalankan 'npx tgcloud migrate' di terminal sendiri, lalu jalankan ulang workflow."
            exit 1
          fi

      - name: Deploy kode
        run: |
          # Bug @tgcloud/cli 0.2.0: pada deploy yang ikut mengubah skema DB, server menerima
          # semua modul tetapi CLI crash saat menulis snapshot lokal (canonical_modules berisi
          # `false`). Itu bukan kegagalan deploy; karena itu error khas ini TIDAK langsung
          # dianggap sukses: hasilnya diverifikasi lewat fetch + status (cloud == berkas lokal).
          out=$(npx tgcloud push --force 2>&1); rc=$?
          echo "$out"
          if [ $rc -ne 0 ]; then
            if grep -q "snapshot.js" <<<"$out" && grep -q "ERR_INVALID_ARG_TYPE" <<<"$out"; then
              echo "::warning::push diterima server tetapi CLI gagal menulis snapshot; memverifikasi lewat fetch + status"
              npx tgcloud fetch
              status=$(npx tgcloud status); echo "$status"
              grep -q "Working directory clean" <<<"$status" || { echo "::error::cloud tidak sama dengan berkas lokal setelah push"; exit 1; }
            else
              exit $rc
            fi
          fi

      - name: Uji restore di database cloud (data sementara, dibersihkan)
        run: |
          cp scripts/ci/cloud-restore-test.js tgcloud/endpoints/zzCloudRestoreTest.js
          out=$(npx tgcloud run endpoints/zzCloudRestoreTest '{}' 2>&1); rc=$?
          rm -f tgcloud/endpoints/zzCloudRestoreTest.js
          echo "$out"
          [ $rc -eq 0 ] && grep -q "idempotent" <<<"$out"

      - name: Uji klaim pengingat di database cloud (data sementara, tanpa kirim pesan)
        run: |
          cp scripts/ci/cloud-reminder-test.js tgcloud/endpoints/zzCloudReminderTest.js
          out=$(npx tgcloud run endpoints/zzCloudReminderTest '{}' 2>&1); rc=$?
          rm -f tgcloud/endpoints/zzCloudReminderTest.js
          echo "$out"
          [ $rc -eq 0 ] && grep -q "raceWinners" <<<"$out"

      - name: Uji jalur DB Nota & PNL di database cloud (data sementara, dibersihkan)
        run: |
          cp scripts/ci/cloud-nota-pnl-test.js tgcloud/endpoints/zzCloudNotaPnlTest.js
          out=$(npx tgcloud run endpoints/zzCloudNotaPnlTest '{}' 2>&1); rc=$?
          rm -f tgcloud/endpoints/zzCloudNotaPnlTest.js
          echo "$out"
          [ $rc -eq 0 ] && grep -q "pnlArsipReplaced" <<<"$out"

      - name: Diagnosa pasca-deploy
        run: scripts/ci/diagnose.sh

      - name: Unggah laporan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnose-report
          path: diagnose-report.md
          if-no-files-found: ignore
